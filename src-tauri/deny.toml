# cargo-deny configuration. Run with `just deny`.
# Docs: https://embarkstudios.github.io/cargo-deny/

[advisories]
# Each ignore below is tracked so it can be dropped once the upstream fix lands.
# Re-check them when running `cargo update` or bumping sqlx / tauri-plugin-opener.
ignore = [
    { id = "RUSTSEC-2026-0459", reason = "libsqlite3-sys 0.30.1 bundles SQLite < 3.54.0; fix is in libsqlite3-sys >= 0.39 but sqlx 0.8.6 pins ^0.30.1. Only reachable when opening a crafted database/-wal pair; the app opens only its own local database. Drop when sqlx supports a patched libsqlite3-sys." },
    { id = "RUSTSEC-2026-0370", reason = "zvariant is unmaintained; transitive via tauri-plugin-opener -> zbus (Linux only). No safe upgrade available." },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names is unmaintained; transitive via tauri-plugin-opener -> zbus (Linux only). No safe upgrade available." },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive is unmaintained; transitive via tauri-plugin-opener -> zbus (Linux only). No safe upgrade available." },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is unmaintained; build-time transitive dependency of the Tauri GTK stack (Linux only)." },
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained (archived; no known vulnerability); compile-time macro dependency of specta and tauri-specta. Drop when they move off it." },
]

[licenses]
# Allow list covers every license present in Cargo.lock for all targets
# (verified with `cargo deny list`); each entry is permissive or weak copyleft
# at file level (MPL-2.0), with no obligations beyond attribution for an app.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

# Inflector (via specta-macros) is BSD-2-Clause: permissive, attribution only.
exceptions = [{ allow = ["BSD-2-Clause"], crate = "Inflector" }]

[licenses.private]
ignore = true

[bans]
# Duplicate versions come mostly from the Tauri stack; warn, don't fail.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

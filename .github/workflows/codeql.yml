name: "CodeQL Advanced"

# Analyzes JavaScript/TypeScript only on frontend changes; `actions` and `rust`
# live in codeql-actions.yml and codeql-rust.yml with their own path filters.
# Only pull requests are path-filtered: every push to master is analyzed so PRs
# always have a base analysis to compare against (GitHub advises against
# path filters on push for code scanning).
# The weekly schedule still re-analyzes master with updated query packs.
on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
    paths:
      - "src/**"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "eslint.config.ts"
      - "vite.config.ts"
      - "tsconfig*.json"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "25 10 * * 0"

# Superseded PR runs are cancelled. Runs on master (push and schedule share the
# refs/heads/master group) are not, so a push never cancels a running analysis.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # upload CodeQL results as code scanning alerts
      packages: read # fetch internal or private CodeQL packs
      actions: read # only required for workflows in private repositories
      contents: read # check out the repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:javascript-typescript"

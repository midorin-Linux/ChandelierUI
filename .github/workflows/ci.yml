name: CI

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - LICENSE
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - LICENSE

# Superseded PR runs are cancelled. Runs on master are not: they are the only
# runs that write caches, and a cancelled run saves nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  CARGO_TERM_COLOR: always

# Cache policy
# ------------
# - Caches are written only by pushes to master. Pull requests (including
#   Dependabot) restore master's cache but never save their own: PR-scoped
#   caches cannot be shared with other PRs and only push master's cache out
#   of the 10 GB repository quota.
# - Only the `rust` and `frontend` jobs use a cache. Other jobs download
#   prebuilt binaries and would gain little from one.

jobs:
  # Determines which areas changed via the GitHub API (no checkout needed) so
  # unaffected jobs are skipped instead of provisioning runners and caches.
  # Falls back to running everything if the file list cannot be determined.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      rustfmt: ${{ steps.filter.outputs.rustfmt }}
      deny: ${{ steps.filter.outputs.deny }}
      frontend: ${{ steps.filter.outputs.frontend }}
      workflows: ${{ steps.filter.outputs.workflows }}
      dependencies: ${{ steps.filter.outputs.dependencies }}
    steps:
      - name: Detect changed areas
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          all_true() {
            {
              echo "rust=true"
              echo "rustfmt=true"
              echo "deny=true"
              echo "frontend=true"
              echo "workflows=true"
              echo "dependencies=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          }

          files=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if ! files=$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files?per_page=100" --jq '.[].filename'); then
              all_true
            fi
          elif [ "$EVENT_NAME" = "push" ]; then
            if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
              all_true
            fi
            if ! files=$(gh api "repos/${REPO}/compare/${BEFORE_SHA}...${AFTER_SHA}" --jq '.files[].filename'); then
              all_true
            fi
            # GitHub's compare API returns at most 300 files; fall back if truncated.
            if [ "$(printf '%s\n' "$files" | wc -l)" -ge 300 ]; then
              all_true
            fi
          else
            all_true
          fi

          if [ -z "$files" ]; then
            all_true
          fi

          rust=false
          rustfmt=false
          deny=false
          frontend=false
          workflows=false
          dependencies=false

          while IFS= read -r file; do
            case "$file" in
              .github/workflows/ci.yml)
                all_true
                ;;
              .github/workflows/*)
                workflows=true
                dependencies=true
                ;;
              .github/*)
                workflows=true
                ;;
              src-tauri/Cargo.toml | src-tauri/Cargo.lock)
                rust=true
                deny=true
                dependencies=true
                ;;
              src-tauri/deny.toml)
                deny=true
                ;;
              src-tauri/rustfmt.toml)
                rustfmt=true
                ;;
              src-tauri/*.rs)
                rust=true
                rustfmt=true
                ;;
              src-tauri/*)
                rust=true
                ;;
              src/bindings.ts)
                # Verified by both the frontend build and src-tauri/tests/bindings.rs.
                rust=true
                frontend=true
                ;;
              .agents/* | .claude/*)
                ;;
              package.json | pnpm-lock.yaml)
                frontend=true
                dependencies=true
                ;;
              src/* | public/* | index.html | pnpm-workspace.yaml | vite.config.ts | eslint.config.ts | tsconfig*.json | .nvmrc | components.json | *.js | *.mjs | *.cjs | *.ts | *.mts | *.cts | *.jsx | *.tsx)
                frontend=true
                ;;
            esac
          done <<< "$files"

          {
            echo "rust=$rust"
            echo "rustfmt=$rustfmt"
            echo "deny=$deny"
            echo "frontend=$frontend"
            echo "workflows=$workflows"
            echo "dependencies=$dependencies"
          } >> "$GITHUB_OUTPUT"

  # Kept separate from `rust`: it needs nightly rustfmt, and rust-cache hashes the
  # version of every installed toolchain into its key. A nightly toolchain in the
  # cached job would change the key daily and make every run a cache miss.
  rustfmt:
    name: rustfmt
    needs: changes
    if: needs.changes.outputs.rustfmt == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustfmt.toml uses nightly-only options (imports_granularity, group_imports),
      # so formatting is checked with nightly rustfmt, as `just fmt-check` does.
      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --profile minimal --component rustfmt

      - name: Check formatting
        working-directory: src-tauri
        run: cargo +nightly fmt --all -- --check

  rust:
    name: rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Debug info roughly halves target/ (measured locally: 3.5 GB -> 1.7 GB for
      # clippy + test), which keeps the cache small and fast to restore.
      CARGO_PROFILE_DEV_DEBUG: 0
      # rust-cache also sets this; set here so it is explicit and part of the key.
      CARGO_INCREMENTAL: 0
      # Minimal Linux libraries required for `cargo clippy` and `cargo test`.
      # Bundler-only packages (librsvg2-dev, libxdo-dev) and tools preinstalled
      # on ubuntu-latest (gcc, make, file, wget, libssl-dev) are omitted.
      APT_PACKAGES: libdbus-1-dev libgtk-3-dev libwebkit2gtk-4.1-dev
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Downloads from the Ubuntu mirror are sometimes very slow (63.8 MB at
      # ~250 kB/s, 4-5 minutes), so the .deb files are cached. Package versions
      # follow the runner image, and APT_PACKAGES is hashed into the key so
      # unrelated edits to ci.yml do not bust the cache.
      - name: Get runner image version
        id: image
        run: |
          {
            echo "os=$ImageOS"
            echo "version=$ImageVersion"
            echo "pkgs=$(printf '%s' "$APT_PACKAGES" | sha256sum | cut -c1-12)"
          } >> "$GITHUB_OUTPUT"

      - name: Restore apt packages
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-${{ steps.image.outputs.os }}-${{ steps.image.outputs.pkgs }}-${{ steps.image.outputs.version }}
          restore-keys: apt-${{ steps.image.outputs.os }}-${{ steps.image.outputs.pkgs }}-

      # /var/cache/apt/archives is root-owned and holds a lock file that
      # actions/cache cannot read, so packages are copied to ~/apt-archives.
      # On an exact cache hit for the same runner image, install the cached
      # .deb files directly without `apt-get update` or network access; fall
      # back to an online install if anything is missing.
      - name: Install Tauri system dependencies
        env:
          APT_CACHE_HIT: ${{ steps.apt-cache.outputs.cache-hit }}
        run: |
          read -ra pkgs <<< "$APT_PACKAGES"
          if compgen -G "$HOME/apt-archives/*.deb" > /dev/null; then
            sudo cp "$HOME"/apt-archives/*.deb /var/cache/apt/archives/
            if [ "$APT_CACHE_HIT" = "true" ]; then
              if sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l \
                apt-get install -y --no-download --no-install-recommends \
                -o DPkg::Options::=--force-unsafe-io \
                /var/cache/apt/archives/*.deb; then
                exit 0
              fi
            fi
          fi
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l \
            apt-get install -y --no-install-recommends \
            -o APT::Keep-Downloaded-Packages=true \
            -o DPkg::Options::=--force-unsafe-io \
            "${pkgs[@]}"

      # autoclean drops .deb files no longer in the package index, so a cache
      # restored from an older image does not grow without bound.
      - name: Collect apt packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.apt-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get autoclean
          rm -rf "$HOME/apt-archives"
          mkdir -p "$HOME/apt-archives"
          cp /var/cache/apt/archives/*.deb "$HOME/apt-archives/"

      - name: Save apt packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}

      # Must run before rust-cache: the installed toolchains are part of its key.
      # Reuse the runner's preinstalled stable toolchain + clippy when present
      # to avoid network checks and mid-cycle cache churn.
      - name: Ensure Rust toolchain
        run: |
          if ! rustup toolchain list | grep -q '^stable.*(default)' \
            || ! rustup component list --toolchain stable --installed | grep -q '^clippy'; then
            rustup toolchain install stable --profile minimal --component clippy
            rustup default stable
          fi
          rustc --version

      # The key changes only with Cargo.lock / Cargo.toml, the stable rustc
      # version, or CARGO_* / RUST* env vars. On a partial match a PR restores
      # the closest master entry and rebuilds only what changed.
      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          # Nothing is installed into ~/.cargo/bin by this job.
          cache-bin: false

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test --locked

  frontend:
    name: frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pnpm version comes from "packageManager" in package.json (single source
      # of truth); do not add a `version:` input, action-setup fails on a mismatch.
      # Dependabot's documentation does not list "packageManager" as a field it
      # updates, so bump it by hand (with its sha512) when upgrading pnpm.
      # standalone installs the prebuilt binary directly instead of npm-installing
      # pnpm and then self-updating to @pnpm/exe.
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          standalone: true

      # setup-node's built-in cache saves on every lockfile change, including in
      # PRs, and cannot be limited to master; the store is cached explicitly below.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Saved right after install so a failing lint, test or build still refreshes it.
      # Pruning first drops packages no longer in the lockfile, so a store restored
      # from an older key does not grow without bound.
      - name: Prune pnpm store
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.pnpm-cache.outputs.cache-hit != 'true'
        run: pnpm store prune

      - name: Save pnpm store
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}

      # Run independent checks concurrently across the runner's CPUs and replay
      # each command's log cleanly in its own group.
      - name: Lint, test, typecheck and build
        run: |
          set -euo pipefail
          out_dir="$RUNNER_TEMP/frontend-ci"
          mkdir -p "$out_dir"

          pnpm lint >"$out_dir/lint.log" 2>&1 &
          pid_lint=$!
          pnpm test >"$out_dir/test.log" 2>&1 &
          pid_test=$!
          pnpm exec tsc >"$out_dir/tsc.log" 2>&1 &
          pid_tsc=$!
          pnpm exec tsc -p tsconfig.test.json >"$out_dir/tsc-test.log" 2>&1 &
          pid_tsc_test=$!
          pnpm exec vite build >"$out_dir/build.log" 2>&1 &
          pid_build=$!

          status=0
          check() {
            local name="$1"
            local pid="$2"
            local log="$3"
            local rc=0
            wait "$pid" || rc=$?
            echo "::group::$name"
            cat "$log"
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              echo "::error::$name failed (exit code $rc)"
              status=1
            fi
          }

          check "Lint" "$pid_lint" "$out_dir/lint.log"
          check "Test" "$pid_test" "$out_dir/test.log"
          check "Typecheck" "$pid_tsc" "$out_dir/tsc.log"
          check "Typecheck (tests)" "$pid_tsc_test" "$out_dir/tsc-test.log"
          check "Build" "$pid_build" "$out_dir/build.log"

          exit "$status"

  deny:
    name: deny
    needs: changes
    if: needs.changes.outputs.deny == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-deny
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-deny

      # Advisories are checked separately in audit.yml (scheduled), so that a new
      # RustSec entry does not turn unrelated pull requests red.
      - name: Check bans, licenses and sources
        run: cargo deny --manifest-path src-tauri/Cargo.toml check bans licenses sources

  dependency-review:
    name: dependency-review
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.dependencies == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high

  # Runs both workflow linters on one runner using prebuilt binaries instead of
  # compiling actionlint from Go source and provisioning two separate runners.
  workflows:
    name: workflows
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install zizmor
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: zizmor

      # Download the prebuilt release archive with a pinned SHA-256 checksum
      # instead of compiling actionlint from Go source (~15s -> <1s).
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o "$archive"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run actionlint
        run: actionlint -color

      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format plain .

name: Audit

# Vulnerability monitoring for Rust dependencies. Advisories change over time
# independently of the code, so this runs on a schedule in addition to changes
# of the manifest/lockfile. Licenses, bans and sources are checked in ci.yml.
on:
  push:
    branches: [master]
    paths:
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
      - src-tauri/deny.toml
  pull_request:
    paths:
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
      - src-tauri/deny.toml
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  advisories:
    name: advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-deny
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-deny

      - name: Check advisories
        run: cargo deny --manifest-path src-tauri/Cargo.toml check advisories
